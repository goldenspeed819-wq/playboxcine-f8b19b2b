<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <style>
      :root { color-scheme: dark; }
      body { width: 340px; margin: 0; font-family: system-ui, sans-serif; background: #0d0d0f; color: #f2f2f2; }
      header { padding: 12px 14px; border-bottom: 1px solid #232327; display: flex; align-items: center; gap: 8px; }
      header b { font-size: 14px; letter-spacing: .5px; }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: hsl(0 85% 55%); }
      main { padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
      button { border: 0; border-radius: 8px; padding: 10px 12px; font-size: 13px; font-weight: 700; cursor: pointer; background: hsl(0 85% 55%); color: #fff; }
      button.ghost { background: #1c1c20; color: #d4d4d8; font-weight: 600; }
      .row { display: flex; gap: 8px; }
      .row button { flex: 1; }
      input, textarea, select { width: 100%; box-sizing: border-box; background: #141417; border: 1px solid #2a2a30; color: #eee; border-radius: 8px; padding: 8px; font-size: 12px; }
      input[type=range] { padding: 0; border: 0; background: transparent; }
      .muted { color: #8a8a93; font-size: 11px; }
      .card { background: #141417; border: 1px solid #232327; border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
      .item { background: #141417; border: 1px solid #232327; border-radius: 8px; padding: 8px; font-size: 12px; }
      .item .u { color: #8a8a93; word-break: break-all; font-size: 10px; }
      #list { max-height: 170px; overflow: auto; display: flex; flex-direction: column; gap: 6px; }
      details { border-top: 1px solid #232327; padding-top: 8px; }
      summary { cursor: pointer; font-size: 12px; color: #8a8a93; }
      details > div { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
      .lbl { font-size: 11px; color: #a1a1aa; display: flex; justify-content: space-between; }
    </style>
  </head>
  <body>
    <header><span class="dot"></span><b>RYNEX CONTROLE</b><span class="muted" id="tab"></span></header>
    <main>
      <div class="card">
        <button id="play">▶ Play / Pausar vídeo</button>
        <div class="row">
          <button id="fs" class="ghost">⛶ Tela cheia</button>
          <button id="mute" class="ghost">🔇 Mudo</button>
        </div>
        <div class="lbl"><span>Volume do site</span><span id="volTxt">100%</span></div>
        <input id="vol" type="range" min="0" max="100" value="100" />
        <div id="status" class="muted">Abra a aba do Rynex e use os botões.</div>
      </div>

      <details>
        <summary>Capturar embed (opcional)</summary>
        <div>
          <div class="row">
            <button id="scan">Procurar embed</button>
            <button id="add" class="ghost">Adicionar à fila</button>
          </div>
          <select id="tipo">
            <option value="movie">Filme</option>
            <option value="series">Série</option>
          </select>
          <input id="title" placeholder="Título" />
          <textarea id="url" rows="2" placeholder="Link do embed RCServer / server.php"></textarea>
          <div id="info" class="muted"></div>
          <div id="found" class="muted"></div>
          <div id="list"></div>
          <div class="row">
            <button id="send">Enviar pro Rynex</button>
            <button id="copy" class="ghost">Copiar JSON</button>
            <button id="clear" class="ghost">Limpar</button>
          </div>
          <input id="site" placeholder="URL do Rynex" />
        </div>
      </details>
      <div class="muted">v1.0.6 · Controle de play, volume e mouse em players externos.</div>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
